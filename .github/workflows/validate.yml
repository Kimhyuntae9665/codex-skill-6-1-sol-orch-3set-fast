name: Validate dispatch ownership

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ownership:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test declared ownership and dependency failures
        run: python -m unittest discover -s tests -v
      - name: Check the example dispatch plan
        run: python skills/6-1-sol-orch-3set-fast/scripts/check_plan.py examples/plan.json --workspace .
